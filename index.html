    <script>
      // Old links used hash routing (/#/work). Move them to real URLs before React boots.
      if (location.hash.indexOf('#/') === 0) {
        history.replaceState(null, '', location.hash.slice(1) || '/');
        window.__hashRedirect = true;
      }
      // Hidden-until-revealed styles only apply when JS runs and motion is allowed.
      var h = document.documentElement;
      h.classList.add('js');
      if (!matchMedia('(prefers-reduced-motion: reduce)').matches) h.classList.add('motion');
      // Failsafe: if the app never boots, show everything.
      setTimeout(function () { if (!h.classList.contains('is-booted')) h.classList.remove('motion'); }, 4000);
    </script>
